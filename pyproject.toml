[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "hirefinn"
version = "0.4.0"
description = "Python SDK for the Finn API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Finn" }]
dependencies = ["httpx>=0.23,<1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.5"]

[project.urls]
Homepage = "https://hirefinn.ai"
Documentation = "https://api.hirefinn.ai/docs"

[tool.hatch.build.targets.wheel]
packages = ["finn"]

[tool.hatch.build.targets.sdist]
include = ["finn", "spec", "scripts", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["finn"]
