# Tests (incl. mypy via tests/test_types.py) on every push and PR; spec drift against the live API spec on PRs,
# main and daily. Never publishes (release.yml does that, on a published GitHub release only).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m mypy
      - run: python -m pytest -q

  spec-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Fails when https://api.hirefinn.ai/v1/openapi.json gains or drops an endpoint the SDK does not account for.
      - run: python scripts/check_drift.py
