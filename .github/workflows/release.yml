# Builds the sdist + wheel and publishes them to PyPI with Trusted Publishing (OIDC).
# No API tokens: PyPI trusts this repo + workflow file + the `pypi` environment (see RELEASING.md).
#
# - GitHub release published (tag vX.Y.Z matching finn/_version.py) -> build, test, publish to PyPI.
# - Manual run (workflow_dispatch) -> build and test only; tick `testpypi` to also publish to TestPyPI.
# Pushes, PRs and plain tag pushes never publish.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testpypi:
        description: Also publish the build to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('finn/_version.py').read()).group(1))")
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG does not match package version v$version" >&2
            exit 1
          fi
      - name: Test
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hirefinn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hirefinn
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
